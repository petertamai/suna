[phases.install]
cmds = [
  "python3 -m ensurepip",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r backend/requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd backend && python -m pytest || true"
]

[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "nodejs-18_x",
  "redis",
  "chromium"
]

[start]
cmd = "cd backend && python api.py & cd frontend && npm start"

[phases.setup.env]
PYTHONPATH = "/app/backend"
NODE_ENV = "production"
NEXT_PUBLIC_URL = "${PUBLIC_URL}"
PLAYWRIGHT_BROWSERS_PATH = "/nix/store"

[phases.prepare]
cmds = [
  "mkdir -p /tmp/playwright"
]
