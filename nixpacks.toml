[phases.install]
cmds = [
  "python -m venv /app/venv",
  "source /app/venv/bin/activate && pip install -r backend/requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = [
  "cd frontend && NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL} NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY} npm run build",
  "cd backend && source /app/venv/bin/activate && python -m pytest || true"
]

[phases.setup]
nixPkgs = [
  "python311",
  "nodejs_20",
  "redis",
  "chromium"
]

[start]
cmd = "cd backend && source /app/venv/bin/activate && python api.py & cd frontend && npm start"

[phases.setup.env]
PYTHONPATH = "/app/backend"
NODE_ENV = "production"
NEXT_PUBLIC_URL = "${PUBLIC_URL}"
PLAYWRIGHT_BROWSERS_PATH = "/nix/store"
