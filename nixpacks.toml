[phases.install]
cmds = [
  "python -m venv /app/venv",
  "source /app/venv/bin/activate && pip install -r backend/requirements.txt",
  "cd frontend && npm install --ignore-engines"
]

[phases.build]
cmds = [
  "cd backend && source /app/venv/bin/activate && python -m pytest || true"
]

[phases.setup]
nixPkgs = [
  "python311",
  "nodejs_20",
  "redis",
  "chromium"
]

[start]
cmd = "cd backend && source /app/venv/bin/activate && python api.py & cd frontend && NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY npm run dev"

[phases.setup.env]
PYTHONPATH = "/app/backend"
NODE_ENV = "development"
PLAYWRIGHT_BROWSERS_PATH = "/nix/store"
