[phases.install]
cmds = [
  "pip install -r backend/requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd backend && python -m pytest"
]

[phases.setup]
nixPkgs = [
  "python311",
  "nodejs-18_x",
  "redis",
  "chromium",
  "playwright",
  "playwright-driver",
  "supervisord"
]

[start]
cmd = "supervisord -n -c /app/supervisor.conf"

[phases.setup.env]
PYTHONPATH = "/app/backend"
NODE_ENV = "production"
NEXT_PUBLIC_URL = "${PUBLIC_URL}"
PLAYWRIGHT_BROWSERS_PATH = "/nix/store"

[phases.prepare]
cmds = [
  "mkdir -p /tmp/playwright",
  "echo '[supervisord]' > /app/supervisor.conf",
  "echo 'nodaemon=true' >> /app/supervisor.conf",
  "echo '' >> /app/supervisor.conf",
  "echo '[program:backend]' >> /app/supervisor.conf",
  "echo 'command=python /app/backend/api.py' >> /app/supervisor.conf",
  "echo 'directory=/app' >> /app/supervisor.conf",
  "echo 'autostart=true' >> /app/supervisor.conf",
  "echo 'autorestart=true' >> /app/supervisor.conf",
  "echo 'stderr_logfile=/dev/stdout' >> /app/supervisor.conf",
  "echo 'stderr_logfile_maxbytes=0' >> /app/supervisor.conf",
  "echo 'stdout_logfile=/dev/stdout' >> /app/supervisor.conf",
  "echo 'stdout_logfile_maxbytes=0' >> /app/supervisor.conf",
  "echo '' >> /app/supervisor.conf",
  "echo '[program:frontend]' >> /app/supervisor.conf",
  "echo 'command=npm start' >> /app/supervisor.conf",
  "echo 'directory=/app/frontend' >> /app/supervisor.conf",
  "echo 'autostart=true' >> /app/supervisor.conf",
  "echo 'autorestart=true' >> /app/supervisor.conf",
  "echo 'stderr_logfile=/dev/stdout' >> /app/supervisor.conf",
  "echo 'stderr_logfile_maxbytes=0' >> /app/supervisor.conf",
  "echo 'stdout_logfile=/dev/stdout' >> /app/supervisor.conf",
  "echo 'stdout_logfile_maxbytes=0' >> /app/supervisor.conf"
]

[phases.prepare.env]
PLAYWRIGHT_BROWSERS_PATH = "/tmp/playwright"
