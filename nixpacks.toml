[phases.install]
cmds = [
  "pip install -r backend/requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd backend && python -m pytest"
]

[phases.setup]
nixPkgs = [
  "python311",
  "nodejs-18_x",
  "redis",
  "chromium",
  "playwright",
  "playwright-driver",
  "supervisord"
]

[start]
cmd = "supervisord -n -c /app/supervisor.conf"

[phases.setup.env]
PYTHONPATH = "/app/backend"
NODE_ENV = "production"
NEXT_PUBLIC_URL = "${PUBLIC_URL}"
PLAYWRIGHT_BROWSERS_PATH = "/nix/store"

[phases.prepare]
cmds = [
  "mkdir -p /tmp/playwright",
  "printf '[supervisord]\nnodaemon=true\n\n[program:backend]\ncommand=python /app/backend/api.py\ndirectory=/app\nautostart=true\nautorestart=true\nstderr_logfile=/dev/stdout\nstderr_logfile_maxbytes=0\nstdout_logfile=/dev/stdout\nstdout_logfile_maxbytes=0\n\n[program:frontend]\ncommand=npm start\ndirectory=/app/frontend\nautostart=true\nautorestart=true\nstderr_logfile=/dev/stdout\nstderr_logfile_maxbytes=0\nstdout_logfile=/dev/stdout\nstdout_logfile_maxbytes=0\n' > /app/supervisor.conf"
]

[phases.prepare.env]
PLAYWRIGHT_BROWSERS_PATH = "/tmp/playwright"
